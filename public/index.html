<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunar AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:17px;background:#121a2d;
 border-bottom:1px solid #26334d;
 display:flex;align-items:center;gap:12px
}
.logo{
 width:43px;height:43px;border-radius:14px;
 background:linear-gradient(135deg,#536dfe,#9b59ff);
 display:grid;place-items:center;font-size:23px
}
header h2{margin:0;font-size:21px}
header small{color:#9caac5}
main{
 flex:1;overflow-y:auto;padding:18px;
 display:flex;flex-direction:column;gap:15px
}
.welcome{text-align:center;margin:auto 0}
.welcome h1{font-size:30px}
.welcome p{color:#9caac5}
.message{
 max-width:85%;padding:13px 16px;
 border-radius:17px;line-height:1.5;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:#5267e9}
.bot{align-self:flex-start;background:#19243b}
footer{
 padding:13px;background:#121a2d;
 display:flex;gap:9px
}
input{
 flex:1;min-width:0;padding:14px;
 border:1px solid #35425e;border-radius:13px;
 background:#1b2740;color:white;font-size:16px;
 outline:none
}
button{
 border:0;border-radius:13px;padding:0 18px;
 background:#5368ef;color:white;font-size:19px
}
button:disabled{opacity:.5}
.note{text-align:center;color:#7888a5;font-size:11px;padding:0 8px 10px}
</style>
</head>
<body>
<header>
 <div class="logo">✦</div>
 <div>
  <h2>Tunar AI</h2>
  <small>Şəxsi süni intellekt köməkçin</small>
 </div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>Salam! Mən Tunar AI ✨</h1>
  <p>Sənə necə kömək edə bilərəm?</p>
 </div>
</main>

<footer>
 <input id="message" placeholder="Tunar AI-yə yaz..." autocomplete="off">
 <button id="send">➤</button>
</footer>
<div class="note">Tunar AI bəzən səhv cavab verə bilər. Vacib məlumatları yoxla.</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function askAI(){
 const message=input.value.trim();
 if(!message || send.disabled)return;

 document.getElementById("welcome")?.remove();
 addMessage(message,"user");
 input.value="";
 send.disabled=true;

 const loading=document.createElement("div");
 loading.className="message bot";
 loading.textContent="Tunar AI düşünür...";
 chat.appendChild(loading);

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();
  loading.textContent=response.ok
   ? data.reply
   : (data.error || "Xəta baş verdi.");
 }catch(error){
  loading.textContent="Serverlə əlaqə qurmaq mümkün olmadı.";
 }

 send.disabled=false;
 input.focus();
 chat.scrollTop=chat.scrollHeight;
}

send.addEventListener("click",askAI);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")askAI();
});
</script>
</body>
</html>
